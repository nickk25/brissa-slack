# Fly.io configuration for Brissa. See docs/DEPLOY.md for the commands that
# use this file and for everything this file cannot say by itself.
#
# Validated with `flyctl config validate` and deployed. The app, the machine,
# the volume and the secrets exist — see docs/DEPLOY.md for what was created.

app = "brissa"           # created 9 September 2026 in the `personal` org
primary_region = "fra"   # Frankfurt. EU data residency for German clients —
                          # see docs/DECISIONS.md ("German embedded in
                          # English", the shortcut working "on a message
                          # written by somebody in the external
                          # organisation") and docs/DEPLOY.md. Brissa's whole
                          # reason to exist is translating for people working
                          # with German-speaking clients; their message
                          # content should not leave the EU to be relayed.

[build]
  # No image/dockerfile line needed: fly finds ./Dockerfile at the repo root
  # on its own.

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

# This USED TO say, at length, that there was deliberately no [[services]]
# block here: Brissa opened a websocket OUTWARD to Slack (Socket Mode) and
# accepted no inbound connections, so a service block would have been
# inventing a port nothing listened on, and its absence was what kept
# `auto_stop_machines` from having anything to act on — no traffic for the
# proxy to watch, nothing to scale to zero, nothing to accidentally stop.
#
# Per-user OAuth changed the premise that reasoning stood on: Slack now has to
# redirect a browser back to a URL this app owns (src/app/server.ts), which
# means something listens on a real port for the first time. A [[services]]
# block is no longer "inventing" anything — it is naming a listener that
# genuinely exists.
#
# What it must NOT do is bring scale-to-zero back in through the side door.
# The two features share a proxy but not a purpose: OAuth's port only ever
# sees a browser, seconds at a time, during an install or a reconnect: it
# looks exactly like the kind of traffic `auto_stop_machines` is designed to
# read as "idle, stop it" — while the websocket Socket Mode holds open the
# whole time would still need to be there when the very next message arrives.
# Reproducing the old guarantee ("always on") now means asking Fly for it
# explicitly, on purpose, rather than relying on there being nothing to ask:
# `auto_stop_machines = false` and `min_machines_running = 1` below. A
# machine stopped by the proxy is a Slack connection silently dropped — the
# exact failure src/slack/socket.ts's `reconnect` comment describes, just
# caused by the proxy instead of by Slack's own end of the socket.
[[services]]
  # Required once the app declares [processes]: Fly refuses a service that does
  # not say which process it fronts, and only says so when asked. `flyctl config
  # validate` caught this twice; reading the file caught it neither time.
  processes     = ["app"]
  internal_port = 8080
  protocol       = "tcp"
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port     = 80
    handlers = ["http"]
    # The callback URL carries an authorisation code. Served over port 80 it
    # crosses the network in clear, and a code is worth exactly one exchange to
    # whoever reads it first. Redirected rather than accepted.
    force_https = true

  # /healthz answers on its own, calling neither OAuth route — see
  # src/app/server.ts and src/app/CLAUDE.md ("Listening: server.ts"). A check
  # that could hang on a route it calls would lie about a different thing the
  # moment that route was slow.
  [[services.http_checks]]
    interval = "15s"
    timeout  = "5s"
    method   = "get"
    path     = "/healthz"

# [[restart]] is the other half of "always on": if the process itself exits
# (a crash, an unhandled rejection reaching top level — this repository's own
# rule is "never swallow an error", so a real fault is meant to be visible,
# not survived silently), Fly should bring the machine back rather than leave
# it stopped.
[[restart]]
  policy = "always"

# The one thing that survives a deploy.
#
# Enrolment is a file, and a file in the image is gone the moment a new image
# replaces it — every deploy would forget the whole team and answer them
# "Brissa does not know which languages you read yet". Everything else Brissa
# holds is memory on purpose and is meant to go: which deliveries were already
# seen, what a channel's policy is.
#
# `BRISSA_ENROLMENT_PATH` must point inside this mount, and it is set as a
# secret rather than written here so the two cannot drift apart silently — see
# docs/DEPLOY.md.
[mounts]
  source      = "brissa_data"
  destination = "/data"

[processes]
  app = "npm start"
